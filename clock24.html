<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>24 Hour Clock</title>
  <style>
    :root {
      color: #17211f;
      background: #e7e0cf;
      font-family: Georgia, serif;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-top: 16px;
    }

    h2 {
      font-size: 1.5rem;
      margin-top: 16px;
    }

    canvas {
      width: min(100%, 300px);
      height: auto;
      display: block;
      margin: 32px auto 0;
    }
  </style>
  <script src="clocks.js"></script>
  <script>
    function getTime() {
      const clock = document.getElementById("clock");
      const clockFace = document.getElementById("clock-face");
      const update = () => {
        const now = new Date();
        clock.textContent = now.toLocaleTimeString();

        const second = now.getSeconds() + now.getMilliseconds() / 1000;
        const minute = now.getMinutes() + second / 60;
        const hour = now.getHours() + minute / 60;
        drawClockFace(clockFace, { hour, minute, second }, "#7b3f9e", 24, 48);

        window.requestAnimationFrame(update);
      };
      window.requestAnimationFrame(update);
    }
  </script>
</head>
<body onload="getTime();">
  <h1>24 Hour Clock</h1>
  <p><a href="index.html">&larr; Back to clock gallery</a></p>
  <canvas id="clock-face" width="320" height="320" aria-label="24 hour analog clock face"></canvas>
  <h2 id="clock">TI:ME</h2>
  <p>A clock where the hour hand sweeps the full face once a day, so noon points straight down.</p>
</body>
</html>
