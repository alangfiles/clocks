<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdowns</title>
  <style>
    :root {
      color: #17211f;
      background: #e7e0cf;
      font-family: Georgia, serif;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-top: 16px;
    }

    .countdown-card {
      border: 1px solid #17211f;
      border-radius: 8px;
      padding: 24px;
      margin-top: 32px;
      background: rgba(255, 255, 255, 0.25);
    }

    .countdown-card h2 {
      font-size: 1.3rem;
      margin: 0 0 8px;
    }

    .countdown-timer {
      font-size: 2rem;
      margin: 12px 0;
    }

    .countdown-detail {
      font-size: 0.9rem;
      margin: 4px 0 0;
    }

    .movie-list {
      margin-top: 16px;
      text-align: left;
    }

    .movie-list summary {
      cursor: pointer;
      text-align: center;
    }

    .movie-list ul {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      font-size: 0.9rem;
    }

    .movie-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
  </style>
  <script>
    // Theatrical release dates for every mainline "Star Wars" movie since 1977
    const starWarsReleases = [
      { title: "Star Wars: A New Hope", date: "1977-05-25" },
      { title: "The Empire Strikes Back", date: "1980-05-21" },
      { title: "Return of the Jedi", date: "1983-05-25" },
      { title: "The Phantom Menace", date: "1999-05-19" },
      { title: "Attack of the Clones", date: "2002-05-16" },
      { title: "Revenge of the Sith", date: "2005-05-19" },
      { title: "The Force Awakens", date: "2015-12-18" },
      { title: "Rogue One", date: "2016-12-16" },
      { title: "The Last Jedi", date: "2017-12-15" },
      { title: "Solo: A Star Wars Story", date: "2018-05-25" },
      { title: "The Rise of Skywalker", date: "2019-12-20" },
      { title: "The Mandalorian & Grogu", date: "2026-05-22" }
    ];
    const starWarsReleaseDates = starWarsReleases.map(release => new Date(release.date));

    function getPredictedNextDate(releaseDates){
      const sortedDates = [...releaseDates].sort((first, second) => first - second);
      const totalSpanMilliseconds = sortedDates[sortedDates.length - 1] - sortedDates[0];
      const averageIntervalMilliseconds = totalSpanMilliseconds / (sortedDates.length - 1);
      const latestRelease = sortedDates[sortedDates.length - 1];

      return new Date(latestRelease.getTime() + averageIntervalMilliseconds);
    }

    function formatCountdown(targetDate){
      const now = new Date();
      let remainingMs = targetDate - now;
      if (remainingMs <= 0) {
        return "It's (probably) out!";
      }

      const days = Math.floor(remainingMs / 86400000);
      remainingMs -= days * 86400000;
      const hours = Math.floor(remainingMs / 3600000);
      remainingMs -= hours * 3600000;
      const minutes = Math.floor(remainingMs / 60000);
      remainingMs -= minutes * 60000;
      const seconds = Math.floor(remainingMs / 1000);

      if (days > 365) {
        const years = Math.floor(days / 365);
        const remainingDays = days % 365;
        return `${years}y ${remainingDays}d ${String(hours).padStart(2, "0")}h ${String(minutes).padStart(2, "0")}m ${String(seconds).padStart(2, "0")}s`;
      }

      return `${days}d ${String(hours).padStart(2, "0")}h ${String(minutes).padStart(2, "0")}m ${String(seconds).padStart(2, "0")}s`;
    }

    function startCountdowns(){
      const starWarsNextDate = getPredictedNextDate(starWarsReleaseDates);
      document.getElementById("star-wars-date").textContent = starWarsNextDate.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });

      const movieList = document.getElementById("star-wars-movie-list");
      [...starWarsReleases]
        .sort((first, second) => new Date(first.date) - new Date(second.date))
        .forEach(release => {
          const item = document.createElement("li");
          const title = document.createElement("span");
          title.textContent = release.title;
          const date = document.createElement("span");
          date.textContent = new Date(release.date).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
          item.append(title, date);
          movieList.append(item);
        });

      const update = () => {
        document.getElementById("star-wars-timer").textContent = formatCountdown(starWarsNextDate);
        window.requestAnimationFrame(update);
      };
      window.requestAnimationFrame(update);
    }
  </script>
</head>
<body onload="startCountdowns();">
  <h1>Countdowns</h1>
  <p><a href="index.html">&larr; Back to clock gallery</a></p>
  <section class="countdown-card">
    <h2>Next Star Wars Movie</h2>
    <p class="countdown-detail">Predicted by adding the average gap between every mainline Star Wars release since 1977 to the latest movie, The Mandalorian &amp; Grogu.</p>
    <p class="countdown-timer" id="star-wars-timer">Calculating&hellip;</p>
    <p class="countdown-detail">Predicted date: <span id="star-wars-date">&mdash;</span></p>
    <details class="movie-list">
      <summary>Show all movie release dates</summary>
      <ul id="star-wars-movie-list"></ul>
    </details>
  </section>
</body>
</html>
